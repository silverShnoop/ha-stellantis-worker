name: Stellantis Login Worker
version: "1.3.0"
slug: stellantis_worker
description: >-
  Local login worker for the Stellantis Vehicles integration. Drives a headless
  browser against the Stellantis sign-in page and returns the OAuth code, so
  your account password never leaves your network.
url: https://github.com/silverShnoop/ha-stellantis-worker
arch:
  - aarch64
  - amd64
init: false
# No ports mapping, deliberately, and not merely unset: with the key absent
# Supervisor publishes nothing to the host and the add-on's Network tab offers
# no way to change that. The endpoint takes an account password in its request
# body, so it should not be reachable from the LAN at all.
#
# Home Assistant still reaches it over Supervisor's internal network, as
# http://<addon-hostname>:3000. The hostname is the slug with underscores
# turned into dashes, prefixed by this repository's hash — it is shown on the
# add-on's own page once installed, so read it there rather than guessing.
host_network: false
options:
  # Hostname suffixes the worker may be sent to. Empty keeps the built-in
  # list: the idpcvs.* sign-in hosts of the brand apps the integration knows.
  allowed_hosts: []
  # Shared secret. When set, POST / must carry it in an X-Worker-Token header
  # or it is refused. Empty checks nothing, and has to stay empty unless a
  # proxy adds the header: the integration cannot send one today.
  token: ""
schema:
  allowed_hosts:
    - str
  token: password?
